services:
  - type: web
    name: biocontrol-ia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: CORS_ORIGIN
        value: https://jimmyalmaciasmo-oss.github.io
